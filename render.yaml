services:
  - type: web
    name: kemi-link-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python prepare.py && gunicorn --chdir backend app.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /api/categories/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.8
      - key: DJANGO_SETTINGS_MODULE
        value: app.settings_hosted_demo
      - key: DEMO_SECRET_KEY
        generateValue: true
